[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satscene"
version = "0.1.0"
description = "Satellite scene classification (ConvNeXt-Tiny) with a rule-based agent layer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1", "timm>=0.9", "albumentations>=1.4", "opencv-python-headless>=4.8",
  "numpy", "scikit-learn", "matplotlib", "seaborn", "pyyaml", "tqdm", "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
