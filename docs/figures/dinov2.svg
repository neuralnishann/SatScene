<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
  <title id="title">DINOv2 ViT-S/14 classifier used for SatScene</title><desc id="desc">RGB image is split into 14-pixel patches, embedded as tokens with a class token and positional embeddings, processed by 12 transformer blocks with global self-attention, and the class-token feature feeds a fine-tuned 14-class head.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#49617a"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18324b}.h{font-size:14px;font-weight:700}.b{font-size:12px}.s{font-size:11px;fill:#49617a}.n{fill:#e8f2fb;stroke:#b8c8d8;stroke-width:1.3;rx:10}.stage{fill:#eaf6ef;stroke:#adcdb8;stroke-width:1.3;rx:10}.head{fill:#fff0d8;stroke:#e5c98e;stroke-width:1.3;rx:10}.l{stroke:#49617a;stroke-width:1.8;marker-end:url(#a)}</style></defs>
  <rect width="1060" height="260" rx="16" fill="#f7f9fc"/><text x="28" y="33" class="h">DINOv2 ViT-S/14 · global transformer attention</text>
  <g text-anchor="middle"><rect x="25" y="89" width="105" height="74" class="n"/><text x="77" y="119" class="h">RGB image</text><text x="77" y="141" class="s">224 × 224</text>
  <rect x="158" y="75" width="144" height="102" class="n"/><text x="230" y="105" class="h">14 px patches</text><text x="230" y="128" class="b">patch embeddings</text><text x="230" y="151" class="s">+ class/position tokens</text>
  <rect x="330" y="75" width="190" height="102" class="stage"/><text x="425" y="105" class="h">Transformer encoder</text><text x="425" y="128" class="b">12 ViT-S blocks</text><text x="425" y="151" class="s">global self-attention</text>
  <rect x="548" y="75" width="158" height="102" class="stage"/><text x="627" y="105" class="h">Class-token feature</text><text x="627" y="128" class="b">pretrained DINOv2</text><text x="627" y="151" class="s">visual representation</text>
  <rect x="734" y="75" width="145" height="102" class="head"/><text x="806" y="105" class="h">Fine-tuned head</text><text x="806" y="128" class="b">linear projection</text><text x="806" y="151" class="s">14 scene logits</text>
  <rect x="907" y="75" width="127" height="102" class="n"/><text x="970" y="105" class="h">Softmax</text><text x="970" y="128" class="b">ranked scores</text><text x="970" y="151" class="s">human review</text></g>
  <g class="l"><path d="M130 126H151"/><path d="M302 126H323"/><path d="M520 126H541"/><path d="M706 126H727"/><path d="M879 126H900"/></g><text x="28" y="220" class="s">Pretrained self-supervised visual features are fine-tuned with labeled scene examples for this 14-class task.</text>
</svg>
