<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
  <title id="title">ConvNeXtV2-Tiny classifier used for SatScene</title><desc id="desc">RGB image enters a convolutional stem then four hierarchical ConvNeXtV2 stages with depths 3, 3, 9, and 3, each separated by downsampling. Global average pooling feeds a fine-tuned 14-class head.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#49617a"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18324b}.h{font-size:14px;font-weight:700}.b{font-size:12px}.s{font-size:11px;fill:#49617a}.n{fill:#e8f2fb;stroke:#b8c8d8;stroke-width:1.3;rx:10}.stage{fill:#eaf6ef;stroke:#adcdb8;stroke-width:1.3;rx:10}.head{fill:#fff0d8;stroke:#e5c98e;stroke-width:1.3;rx:10}.l{stroke:#49617a;stroke-width:1.8;marker-end:url(#a)}</style></defs>
  <rect width="1060" height="260" rx="16" fill="#f7f9fc"/><text x="28" y="33" class="h">ConvNeXtV2-Tiny · hierarchical convolution</text>
  <g text-anchor="middle"><rect x="25" y="89" width="105" height="74" class="n"/><text x="77" y="119" class="h">RGB image</text><text x="77" y="141" class="s">224 × 224</text>
  <rect x="158" y="89" width="110" height="74" class="n"/><text x="213" y="119" class="h">Stem</text><text x="213" y="141" class="s">4 × 4 conv</text>
  <rect x="296" y="75" width="130" height="102" class="stage"/><text x="361" y="105" class="h">Stage 1</text><text x="361" y="128" class="b">3 blocks · GRN</text><text x="361" y="151" class="s">local features</text>
  <rect x="454" y="75" width="130" height="102" class="stage"/><text x="519" y="105" class="h">Stage 2</text><text x="519" y="128" class="b">3 blocks · GRN</text><text x="519" y="151" class="s">downsampled</text>
  <rect x="612" y="75" width="130" height="102" class="stage"/><text x="677" y="105" class="h">Stage 3</text><text x="677" y="128" class="b">9 blocks · GRN</text><text x="677" y="151" class="s">larger context</text>
  <rect x="770" y="75" width="112" height="102" class="stage"/><text x="826" y="105" class="h">Stage 4</text><text x="826" y="128" class="b">3 blocks</text><text x="826" y="151" class="s">high-level</text>
  <rect x="910" y="75" width="124" height="102" class="head"/><text x="972" y="105" class="h">Pool + linear</text><text x="972" y="128" class="b">14 scene logits</text><text x="972" y="151" class="s">fine-tuned head</text></g>
  <g class="l"><path d="M130 126H151"/><path d="M268 126H289"/><path d="M426 126H447"/><path d="M584 126H605"/><path d="M742 126H763"/><path d="M882 126H903"/></g><text x="28" y="220" class="s">Each block uses depthwise convolution, channel mixing, GELU and Global Response Normalization (GRN).</text>
</svg>
