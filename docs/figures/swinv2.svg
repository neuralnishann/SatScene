<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" role="img" aria-labelledby="title desc">
  <title id="title">Swin Transformer V2-Tiny classifier used for SatScene</title><desc id="desc">RGB input is patch embedded and passes through four hierarchical shifted-window transformer stages with depths 2, 2, 6, and 2. Patch merging downsamples between stages. Normalization and pooled features feed a fine-tuned 14-class head.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#49617a"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18324b}.h{font-size:14px;font-weight:700}.b{font-size:12px}.s{font-size:11px;fill:#49617a}.n{fill:#e8f2fb;stroke:#b8c8d8;stroke-width:1.3;rx:10}.stage{fill:#eaf6ef;stroke:#adcdb8;stroke-width:1.3;rx:10}.head{fill:#fff0d8;stroke:#e5c98e;stroke-width:1.3;rx:10}.l{stroke:#49617a;stroke-width:1.8;marker-end:url(#a)}</style></defs>
  <rect width="1060" height="260" rx="16" fill="#f7f9fc"/><text x="28" y="33" class="h">SwinV2-Tiny · hierarchical shifted-window attention</text>
  <g text-anchor="middle"><rect x="25" y="89" width="105" height="74" class="n"/><text x="77" y="119" class="h">RGB image</text><text x="77" y="141" class="s">256 × 256</text>
  <rect x="158" y="89" width="112" height="74" class="n"/><text x="214" y="119" class="h">Patch embed</text><text x="214" y="141" class="s">window size 8</text>
  <rect x="298" y="75" width="130" height="102" class="stage"/><text x="363" y="105" class="h">Stage 1</text><text x="363" y="128" class="b">2 attention blocks</text><text x="363" y="151" class="s">window / shifted</text>
  <rect x="456" y="75" width="130" height="102" class="stage"/><text x="521" y="105" class="h">Stage 2</text><text x="521" y="128" class="b">2 attention blocks</text><text x="521" y="151" class="s">window / shifted</text>
  <rect x="614" y="75" width="130" height="102" class="stage"/><text x="679" y="105" class="h">Stage 3</text><text x="679" y="128" class="b">6 attention blocks</text><text x="679" y="151" class="s">window / shifted</text>
  <rect x="772" y="75" width="110" height="102" class="stage"/><text x="827" y="105" class="h">Stage 4</text><text x="827" y="128" class="b">2 blocks</text><text x="827" y="151" class="s">global features</text>
  <rect x="910" y="75" width="124" height="102" class="head"/><text x="972" y="105" class="h">Norm + pool</text><text x="972" y="128" class="b">14 scene logits</text><text x="972" y="151" class="s">fine-tuned head</text></g>
  <g class="l"><path d="M130 126H151"/><path d="M270 126H291"/><path d="M428 126H449"/><path d="M586 126H607"/><path d="M744 126H765"/><path d="M882 126H903"/></g><text x="28" y="220" class="s">Patch merging between stages reduces resolution; shifted windows let information cross local-window boundaries.</text>
</svg>
